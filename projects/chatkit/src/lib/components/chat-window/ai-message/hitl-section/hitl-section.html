@if (hasRequests()) {
  <div class="dw-hitl-section" [class.dw-hitl-section-highlighted]="isHighlighted()">
    <div class="dw-hitl-header">
      <span class="dw-hitl-header-text">
        {{ headerLabel() }}-
        <strong>{{ requestCount() }} request(s)</strong>
      </span>
      @if (hasPendingRequests()) {
        <button class="dw-hitl-cancel-btn" (click)="onCancel()">
          <dw-stop-icon></dw-stop-icon>
        </button>
      }
    </div>
    @for (requestId of hitlRequestIds(); track requestId) {
      <dw-hitl-request-card
        [requestId]="requestId"
        [hitlItem]="getHitlItem(requestId)"
        [autoResolutionMap]="autoResolutionMap()"
        [autoResolutionRulesMap]="autoResolutionRulesMap()"
        [showAutoResolution]="showAutoResolution()"
        [blockAutoResolutionAgentLevel]="blockAutoResolutionAgentLevel()"
        (resolve)="onResolve($event)"
        (autoResolution)="onAutoResolution($event)"
      />
    }
  </div>
}

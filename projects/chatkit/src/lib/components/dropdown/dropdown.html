<div class="dw-dropdown" [class.dw-dropdown-open]="isOpen()" [class.dw-dropdown-loading]="loading">
  @if (label) {
    <span class="dw-dropdown-label">{{ label }}</span>
  }

  <div class="dw-dropdown-select-wrapper">
    <div class="dw-dropdown-trigger" (click)="toggle(); $event.stopPropagation()">
      <span class="dw-dropdown-value" [class.dw-dropdown-placeholder]="!selectedOption || loading">
        {{ displayLabel }}
      </span>
      <span class="dw-dropdown-icon">
        @if (loading) {
          <dw-loader-icon />
        } @else {
          <span class="dw-dropdown-arrow" [class.dw-dropdown-arrow-up]="isOpen()">
            <dw-chevron-icon />
          </span>
        }
      </span>
    </div>

    @if (isOpen() && !loading) {
      <div
        class="dw-dropdown-panel"
        [class.dw-dropdown-panel-top]="position === 'top'"
        [class.dw-dropdown-panel-bottom]="position === 'bottom'"
      >
        <ul class="dw-dropdown-list">
          @for (option of options; track option.value) {
            <li
              class="dw-dropdown-item"
              [class.dw-dropdown-item-selected]="option.value === value"
              (click)="selectOption(option); $event.stopPropagation()"
            >
              {{ option.label }}
            </li>
          } @empty {
            <li class="dw-dropdown-empty">No options available</li>
          }
        </ul>
      </div>
    }
  </div>
</div>
